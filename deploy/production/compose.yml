# DataRun production runtime.
#
# Topology since the 2026-08-29 move from Google Cloud to Proxmox:
#   - this Compose file runs on the API VM, datarun-prod.lab (192.168.1.110),
#     from /home/nmcp/datarun, and owns exactly one container, `app`.
#     The host also runs unrelated containers this file does not own;
#   - PostgreSQL 16 is a managed service on the DB VM, datarun-prod-db.lab
#     (192.168.1.111). It is not containerized and not owned by this file;
#   - nginx and TLS termination are external to this file.
#
# The listener is bound to the VM address for the external proxy. Secrets come
# from the host environment and are never committed. See release-boundary.md.
name: datarun

services:
  app:
    image: "${DATARUN_API_IMAGE:?Set DATARUN_API_IMAGE to an immutable DataRun API image}"
    restart: always
    container_name: datarunapi
    mem_limit: 2500m
    environment:
      - _JAVA_OPTIONS=-Xms1g -Xmx1700m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_DATASOURCE_USERNAME=nmcpdb
      - SPRING_DATASOURCE_PASSWORD=${NMCPDB_PASSWORD:?Set NMCPDB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.1.111:5432/nmcpdb?sslmode=require&logServerErrorDetail=false
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.111:5432/nmcpdb?sslmode=require&logServerErrorDetail=false
      - SPRING_LIQUIBASE_USER=nmcpdb
      - SPRING_LIQUIBASE_PASSWORD=${NMCPDB_PASSWORD:?Set NMCPDB_PASSWORD}
      - DATARUN_JWT_BASE64_SECRET=${DATARUN_JWT_BASE64_SECRET:?Set DATARUN_JWT_BASE64_SECRET}
      # Monitoring through GlitchTip, each part off while its value is empty (.env.example).
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - DATARUN_ETL_HEARTBEAT_URL=${DATARUN_ETL_HEARTBEAT_URL:-}
      # Downstream's reader role for schema feed (FeedReaderGrants); empty changes no grant and logs a WARN at start.
      - DATARUN_FEED_READER_ROLE=${DATARUN_FEED_READER_ROLE:-}
      # Submission review's conflict detection on the upload routes (docs/agent-context/api-v2.md, activation
      # switches); off unless set to true here, the container then recreated. Setting it back is the rollback.
      - DATARUN_ACTIVATION_CONFLICT_DETECTION=${DATARUN_ACTIVATION_CONFLICT_DETECTION:-false}
    ports:
      - "192.168.1.110:8080:8080"
    # The container log rotates: at most 5 files of 20 MB (json-file keeps everything without these options).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 60

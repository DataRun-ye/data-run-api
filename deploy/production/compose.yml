name: datarun

services:
  app:
    image: "${DATARUN_API_IMAGE:?Set DATARUN_API_IMAGE to an immutable DataRun API image}"
    restart: always
    container_name: datarunapi
    mem_limit: 2500m
    environment:
      - _JAVA_OPTIONS=-Xms1g -Xmx1700m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_DATASOURCE_USERNAME=nmcpdb
      - SPRING_DATASOURCE_PASSWORD=${NMCPDB_PASSWORD:?Set NMCPDB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/nmcpdb
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:5432/nmcpdb
      - SPRING_LIQUIBASE_USER=nmcpdb
      - SPRING_LIQUIBASE_PASSWORD=${NMCPDB_PASSWORD:?Set NMCPDB_PASSWORD}
      - DATARUN_JWT_BASE64_SECRET=${DATARUN_JWT_BASE64_SECRET:?Set DATARUN_JWT_BASE64_SECRET}
    ports:
      - 8080:8080
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: "ghcr.io/vadosware/pg_idkit:0.2.3-pg16.2-alpine3.18-amd64"
    restart: always
    container_name: nmcp-db
    shm_size: 1gb
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis-entrypoint/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    environment:
      - POSTGRES_USER=nmcpdb
      - POSTGRES_PASSWORD=${NMCPDB_PASSWORD:?Set NMCPDB_PASSWORD}
      - POSTGRES_DB=nmcpdb
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx
    restart: always
    container_name: datarun-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certbot:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy

  letsencrypt:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    command: ["certonly", "--dns-google", "--dns-google-credentials", "/etc/google/credentials.json", "-d", "api.nmcpye.org"]
    depends_on:
      - nginx

volumes:
  postgis_data:

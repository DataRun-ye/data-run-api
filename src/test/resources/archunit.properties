# ArchUnit (https://www.archunit.org/userguide/html/000_Index.html#_freezing_arch_rules).
# Frozen rules keep their known violations here, committed; a new violation fails the build, and a fixed one
# leaves the store. A missing store is an error rather than a silent new baseline: create one only on purpose,
# with -Darchunit.freeze.store.default.allowStoreCreation=true, and review it.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false

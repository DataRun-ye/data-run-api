# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    org:
      springframework:
#        jdbc:
#          core: DEBUG
#          pool: DEBUG
#          transaction: DEBUG
        security:
          web:
            FilterChainProxy=TRACE:
    ROOT: INFO
    org.springframework.batch: INFO
    tech.jhipster: DEBUG
    org.nmcpye.datarun: DEBUG
#    org.hibernate.SQL: DEBUG
#    org.nmcpye.datarun: DEBUG

spring:
  devtools:
    restart:
      enabled: false
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
#  cloud:
#    consul:
#      config:
#        fail-fast: false # if not in "prod" profile, do not force to use Spring Cloud Config
#        format: yaml
#        profile-separator: '-'
#      discovery:
#        prefer-ip-address: true
#        tags:
#          - profile=${spring.profiles.active}
#          - version='@project.version@'
#          - git-version=${git.commit.id.describe:}
#          - git-commit=${git.commit.id.abbrev:}
#          - git-branch=${git.branch:}
#      host: localhost
#      port: 8500
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/dataRunApiStages
    username: dataRunApi
    password: dataRunApi

    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: dev
  mail:
    host: localhost
    port: 25
    username:
    password:
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false
#  batch:
#    jdbc:
#      initialize-schema: always
server:
  port: 8080
  # From the jhipster new upgrade
  # make sure requests the proxy uri instead of the server one
#  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
datarun:
  transition:
    capture-live-shadow-enabled: false
  security:
    authentication:
      jwt:
        #        token-validity-in-seconds: 900 # Token is valid 15 minutes
        token-validity-in-seconds: 86400 # Token is valid 24 hours
        refresh-token-validity-in-seconds: 2592000 # 30 days
        token-validity-in-seconds-for-remember-me: 2592000
outbox:
  relay:
    poll-interval-ms: 2000   # polling delay between polls (ms)
    batch-size: 20           # how many to claim per poll
    worker-threads: 8        # number of concurrent worker threads
    max-attempts: 5
    visibility-timeout-seconds: 600   # reclaim if processing_started older than this
    reclaim-interval-ms: 60000
backoff:
  base-seconds: 30
  jitter-seconds: 5
  max-seconds: 3600


pilot:
  repeat:
    uids: RPT_aaf9a7ade8ad8535,RPT_0cb69bd7ed22c6d5
  page:
    size: 500
  run:
    backfill: true
    projection: true

migration:
  size: 200
  cron: "0 */1 * * * *"

jhipster:
  client-app:
    name: "datarun"
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 200 # Number of objects in each cache entry
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100,http://localhost:9000,https://localhost:9000'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # Public development fallback; production requires DATARUN_JWT_BASE64_SECRET.
        base64-secret: ${DATARUN_DEV_JWT_BASE64_SECRET:RGF0YVJ1bi1kZXZlbG9wbWVudC1vbmx5LUpXVC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTIwMjYtMDctMjY=}
        # Token is valid 24 hours
        token-validity-in-seconds: 86400 # Token is valid 24 hours
        #        token-validity-in-seconds: 900 # Token is valid 15 minutes
        token-validity-in-seconds-for-remember-me: 2592000

  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://127.0.0.1:8080
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
